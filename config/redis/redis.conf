# ============================================
# FINTECH REALTIME PROCESSING SYSTEM
# Redis Configuration
# ============================================

# Güvenlik
# Şifre docker-compose.yml içinden REDIS_PASSWORD çevre değişkeniyle verilir.

# Bellek Yönetimi
maxmemory 256mb
maxmemory-policy allkeys-lru

# Kalıcılık (Persistence)
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfsync everysec

# Ağ
bind 0.0.0.0
protected-mode yes
tcp-keepalive 300
timeout 0

# Loglama
loglevel notice

# Veritabanları
databases 16
# DB 0: Session yönetimi
# DB 1: Rate limiting
# DB 2: Cache (bakiye, fraud kuralları)
# DB 3: Distributed locks
# DB 4: İşlem durumu cache
