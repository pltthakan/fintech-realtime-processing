spring:
  datasource:
    url: jdbc:postgresql://postgresql:5432/fintech_db?currentSchema=account_service
  kafka:
    bootstrap-servers: kafka:29092

clients:
  user-service:
    base-url: http://user-service:8081

eureka:
  instance:
    hostname: account-service
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.fintech.account: INFO
